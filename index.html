<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>台股 ATR 停損停利計算器</title><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 14px}h1{font-size:32px;margin:0 0 8px}.sub,.hint,.footer{color:#9ca3af;line-height:1.7}.badge{display:inline-block;color:#d6b15f;border:1px solid rgba(214,177,95,.5);border-radius:999px;padding:8px 12px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 18px 70px rgba(0,0,0,.35)}label{display:block;color:#9ca3af;margin:14px 0 7px}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:#202633;color:#eef2ff;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#e3c16c,#9f792a);color:#090b10}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:#d6b15f;margin-top:12px;line-height:1.6}.metrics,.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:#172033;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px}.k{font-size:13px;color:#9ca3af}.v{font-size:24px;font-weight:900;margin-top:7px}.title{color:#d6b15f;font-weight:900;font-size:18px;margin:6px 0 12px}.red{color:#ef4444}.green{color:#22c55e}.blue{color:#60a5fa}.advice{border-left:4px solid #d6b15f;background:rgba(255,255,255,.05);border-radius:14px;padding:13px 14px;margin:10px 0;line-height:1.6}.danger{border-left-color:#ef4444}.good{border-left-color:#22c55e}.watch{border-left-color:#60a5fa}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}td,th{border-bottom:1px solid rgba(255,255,255,.1);padding:9px;text-align:right}td:first-child,th:first-child{text-align:left}.empty{min-height:320px;display:grid;place-items:center;color:#9ca3af;text-align:center;line-height:1.8}.symwrap{position:relative}.suggest{display:none;position:absolute;z-index:9;top:86px;left:0;right:0;background:#111827;border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}.sug{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}.sug:hover{background:#263247}.sug b{color:#d6b15f}.sug span{color:#9ca3af;font-size:13px;margin-left:6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.metrics,.levels{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>台股 ATR 停損停利計算器</h1><div class="sub">輸入台股代碼或公司名稱，支援上市與上櫃，計算停損、移動停利與加碼建議。</div><div class="badge">老韭投資筆記｜風控工具</div><main class="grid"><section class="card"><div class="title">輸入條件</div><div class="symwrap"><label>股票代碼或公司名稱</label><input id="symbol" value="台達電" placeholder="輸入代碼、股名或部分關鍵字"><div id="suggest" class="suggest"></div></div><label>買進價</label><input id="buyPrice" inputmode="decimal" placeholder="例：1714.4"><div class="row"><div><label>ATR 天數</label><select id="atrDays"><option value="10">10 日：短線</option><option value="14" selected>14 日：標準</option><option value="20">20 日：波段</option></select></div><div><label>市場</label><select id="market"><option value="auto" selected>自動判斷</option><option value="tw">上市 TWSE</option><option value="otc">上櫃 TPEx</option></select></div></div><button id="analyzeBtn">開始計算</button><div id="status" class="status"></div><div class="hint">可輸入部分股名或數字，會出現相近個股。上市股走 TWSE；上櫃股走 TPEx 舊版月資料，若官方端擋 CORS，會顯示抓取失敗。</div></section><section class="card" id="result"><div class="empty">輸入股票後按「開始計算」。</div></section></main><div class="footer">風險警語：本工具只做技術分析與風控試算，不是投資建議，也不保證資料即時或正確。</div></div><script>const stocks=[['2330','台積電','tw'],['2317','鴻海','tw'],['2454','聯發科','tw'],['2308','台達電','tw'],['2382','廣達','tw'],['3231','緯創','tw'],['6669','緯穎','tw'],['2376','技嘉','tw'],['2357','華碩','tw'],['3037','欣興','tw'],['8046','南電','tw'],['2327','國巨','tw'],['2492','華新科','tw'],['1582','信錦','tw'],['3017','奇鋐','tw'],['3324','雙鴻','otc'],['3653','健策','tw'],['3661','世芯-KY','tw'],['3443','創意','tw'],['2059','川湖','tw'],['2383','台光電','tw'],['2368','金像電','tw'],['6805','富世達','otc'],['2603','長榮','tw'],['2609','陽明','tw'],['2615','萬海','tw'],['2412','中華電','tw'],['2881','富邦金','tw'],['2882','國泰金','tw'],['6488','環球晶','otc'],['3105','穩懋','otc'],['5483','中美晶','otc'],['4966','譜瑞-KY','tw'],['5274','信驊','otc'],['3529','力旺','otc'],['3260','威剛','otc'],['8299','群聯','otc'],['6187','萬潤','otc'],['6147','頎邦','otc'],['5347','世界','otc'],['5371','中光電','otc'],['3264','欣銓','otc'],['6223','旺矽','otc'],['6274','台燿','otc'],['6438','迅得','otc'],['3293','鈊象','otc'],['4743','合一','otc'],['4123','晟德','otc'],['1795','美時','tw'],['8069','元太','otc'],['6279','胡連','otc'],['3211','順達','otc'],['8358','金居','otc'],['5439','高技','otc'],['6188','廣明','otc']];const fmt=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'--';const pct=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'--';function pick(x){x=x.trim();let m=x.match(/\d{4}/);if(m)return m[0];let hit=stocks.find(s=>s[1]===x)||stocks.find(s=>x&&s[1].includes(x));return hit?hit[0]:x}function marketOf(code,sel){if(sel!=='auto')return sel;let s=stocks.find(x=>x[0]===code);return s?s[2]:'tw'}function n(v){return parseFloat(String(v||'').replace(/,/g,'').replace(/--/g,''))}function roc(s){let p=String(s).split('/');return p.length===3?`${+p[0]+1911}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`:s}function ymdMonths(k=9){let a=[],d=new Date();for(let i=0;i<k;i++){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}01`)}return a}function rocMonths(k=9){let a=[],d=new Date();for(let i=0;i<k;i++){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()-1911}/${String(x.getMonth()+1).padStart(2,'0')}`)}return a}async function getJson(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}function uniqueSort(all){let seen=new Set();return all.filter(r=>!seen.has(r.date)&&seen.add(r.date)).sort((a,b)=>a.date.localeCompare(b.date))}async function fetchTwse(code){let all=[];for(const date of ymdMonths()){let url=`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${date}&stockNo=${code}`;try{let j=await getJson(url);(j.data||[]).forEach(r=>{let open=n(r[3]),high=n(r[4]),low=n(r[5]),close=n(r[6]),volume=n(r[1]);if([open,high,low,close].every(Number.isFinite))all.push({date:roc(r[0]),open,high,low,close,volume})})}catch(e){}}let rows=uniqueSort(all);if(rows.length<30)throw Error('TWSE 日線不足');return{data:rows,source:'TWSE 上市官方資料 '+code}}async function fetchOtc(code){let all=[];for(const m of rocMonths()){let url=`https://www.tpex.org.tw/web/stock/aftertrading/daily_trading_info/st43_result.php?l=zh-tw&d=${m}&stkno=${code}`;try{let j=await getJson(url);let arr=j.aaData||j.data||[];arr.forEach(r=>{let open=n(r[3]),high=n(r[4]),low=n(r[5]),close=n(r[6]),volume=n(r[1]);if([open,high,low,close].every(Number.isFinite))all.push({date:roc(r[0]),open,high,low,close,volume})})}catch(e){}}let rows=uniqueSort(all);if(rows.length<30)throw Error('TPEx 日線不足或被瀏覽器擋資料');return{data:rows,source:'TPEx 上櫃官方資料 '+code}}async function fetchDaily(code,market){if(market==='otc')return await fetchOtc(code);if(market==='tw')return await fetchTwse(code);try{return await fetchTwse(code)}catch(e){return await fetchOtc(code)}}function atr(rows,d){let trs=[];for(let i=1;i<rows.length;i++){let r=rows[i],p=rows[i-1];trs.push(Math.max(r.high-r.low,Math.abs(r.high-p.close),Math.abs(r.low-p.close)))}let x=trs.slice(-d);return x.reduce((a,b)=>a+b,0)/x.length}function sma(rows,d){let x=rows.slice(-d);return x.reduce((a,r)=>a+r.close,0)/x.length}function render({code,source,rows,days,buy}){let last=rows.at(-1),cur=last.close,a=atr(rows,days),hi20=Math.max(...rows.slice(-20).map(r=>r.high)),lo20=Math.min(...rows.slice(-20).map(r=>r.low)),ma20=sma(rows,20),ma60=sma(rows,60),gain=buy?(cur-buy)/buy*100:NaN,stop2=(buy||cur)-a*2,stop25=(buy||cur)-a*2.5,trail=hi20-a*3,atrp=a/cur*100;let adv=[];if(buy){if(cur<=stop2)adv.push(['danger',`目前價已跌破 ATR × 2 停損線 ${fmt(stop2)}，停損優先。`]);else if(gain>6)adv.push(['good',`已有獲利 ${pct(gain)}，改用移動停利 ${fmt(trail)} 保護利潤。`]);else adv.push(['watch',`目前損益 ${pct(gain)}，標準停損看 ${fmt(stop2)}，波動大看 ${fmt(stop25)}。`])}else adv.push(['watch',`沒有輸入買進價，用目前價反推新建倉停損：${fmt(stop2)}。`]);if(cur>ma20&&ma20>ma60&&cur<(buy||ma20)+a*3)adv.push(['good','趨勢偏強，可考慮小量加碼，但停損要跟著 ATR 線。']);else if(cur>(buy||ma20)+a*3)adv.push(['danger','目前離買進價或均線太遠，不建議追高加碼。']);else adv.push(['watch','加碼條件普通，等拉回不破 20 日線或放量突破再看。']);if(cur<ma20)adv.push(['danger','目前價低於 20 日均線，短線轉弱，先防守。']);let recent=rows.slice(-8).reverse();document.getElementById('result').innerHTML=`<div class="title">${code}｜${source}｜最新日線：${last.date}</div><div class="metrics"><div class="box"><div class="k">目前價</div><div class="v">${fmt(cur)}</div></div><div class="box"><div class="k">買進價</div><div class="v">${buy?fmt(buy):'未輸入'}</div><div class="k">${buy?'損益 '+pct(gain):''}</div></div><div class="box"><div class="k">${days} 日 ATR</div><div class="v">${fmt(a)}</div><div class="k">約股價 ${atrp.toFixed(2)}%</div></div></div><div class="title" style="margin-top:18px">關鍵價位</div><div class="levels"><div class="box"><div class="k">標準停損 ATR × 2</div><div class="v red">${fmt(stop2)}</div></div><div class="box"><div class="k">波動大停損 ATR × 2.5</div><div class="v red">${fmt(stop25)}</div></div><div class="box"><div class="k">移動停利 20 日高點 - ATR × 3</div><div class="v green">${fmt(trail)}</div></div><div class="box"><div class="k">20 日均線</div><div class="v blue">${fmt(ma20)}</div></div><div class="box"><div class="k">60 日均線</div><div class="v blue">${fmt(ma60)}</div></div><div class="box"><div class="k">20 日低點</div><div class="v">${fmt(lo20)}</div></div></div><div class="title" style="margin-top:18px">操作建議</div>${adv.map(x=>`<div class="advice ${x[0]}">${x[1]}</div>`).join('')}<div class="title" style="margin-top:18px">最近日線</div><table><thead><tr><th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>量</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.open)}</td><td>${fmt(r.high)}</td><td>${fmt(r.low)}</td><td>${fmt(r.close)}</td><td>${fmt(r.volume)}</td></tr>`).join('')}</tbody></table>`}async function analyze(){let btn=document.getElementById('analyzeBtn'),status=document.getElementById('status'),code=pick(document.getElementById('symbol').value),buy=parseFloat(document.getElementById('buyPrice').value),days=parseInt(document.getElementById('atrDays').value,10),mk=marketOf(code,document.getElementById('market').value);btn.disabled=true;status.textContent=`正在抓 ${mk==='otc'?'TPEx 上櫃':'TWSE 上市'} 日線資料...`;try{let r=await fetchDaily(code,mk);status.textContent=`資料成功：${r.source}，共 ${r.data.length} 筆日線。`;render({code,source:r.source,rows:r.data,days,buy:Number.isFinite(buy)&&buy>0?buy:null})}catch(e){status.textContent='抓不到資料。請改用代碼，或手動切換上市／上櫃再試。';document.getElementById('result').innerHTML=`<div class="empty">資料抓取失敗。<br>請測上市 2308、2330，或上櫃 3324、6488、8069。<br><br>錯誤：${e.message}</div>`}finally{btn.disabled=false}}function showSug(){let q=document.getElementById('symbol').value.trim(),box=document.getElementById('suggest');if(!q){box.style.display='none';return}let m=stocks.filter(s=>s[0].includes(q)||s[1].includes(q)).slice(0,8);if(!m.length){box.style.display='none';return}box.innerHTML=m.map(s=>`<div class="sug" data-code="${s[0]}" data-name="${s[1]}" data-mk="${s[2]}"><b>${s[0]}</b> ${s[1]} <span>${s[2]==='otc'?'上櫃':'上市'}</span></div>`).join('');box.style.display='block'}document.getElementById('symbol').addEventListener('input',showSug);document.getElementById('suggest').addEventListener('click',e=>{let el=e.target.closest('.sug');if(!el)return;document.getElementById('symbol').value=`${el.dataset.code} ${el.dataset.name}`;document.getElementById('market').value=el.dataset.mk;document.getElementById('suggest').style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('.symwrap'))document.getElementById('suggest').style.display='none'});document.getElementById('analyzeBtn').addEventListener('click',analyze);document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});document.getElementById('buyPrice').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});</script></body></html>
