<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>台股 ATR 停損停利計算器</title><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 14px}h1{font-size:32px;margin:0 0 8px}.sub,.hint,.footer{color:#9ca3af;line-height:1.7}.badge{display:inline-block;color:#d6b15f;border:1px solid rgba(214,177,95,.5);border-radius:999px;padding:8px 12px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 18px 70px rgba(0,0,0,.35)}label{display:block;color:#9ca3af;margin:14px 0 7px}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:#202633;color:#eef2ff;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#e3c16c,#9f792a);color:#090b10}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:#d6b15f;margin-top:12px;line-height:1.6}.metrics,.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:#172033;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px}.k{font-size:13px;color:#9ca3af}.v{font-size:24px;font-weight:900;margin-top:7px}.title{color:#d6b15f;font-weight:900;font-size:18px;margin:6px 0 12px}.red{color:#ef4444}.green{color:#22c55e}.blue{color:#60a5fa}.advice{border-left:4px solid #d6b15f;background:rgba(255,255,255,.05);border-radius:14px;padding:13px 14px;margin:10px 0;line-height:1.6}.danger{border-left-color:#ef4444}.good{border-left-color:#22c55e}.watch{border-left-color:#60a5fa}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}td,th{border-bottom:1px solid rgba(255,255,255,.1);padding:9px;text-align:right}td:first-child,th:first-child{text-align:left}.empty{min-height:320px;display:grid;place-items:center;color:#9ca3af;text-align:center;line-height:1.8}@media(max-width:850px){.grid{grid-template-columns:1fr}.metrics,.levels{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>台股 ATR 停損停利計算器</h1><div class="sub">輸入台股代碼或公司名稱，抓 TWSE 官方日線資料，計算停損、移動停利與加碼建議。</div><div class="badge">老韭投資筆記｜風控工具</div><main class="grid"><section class="card"><div class="title">輸入條件</div><label>股票代碼或公司名稱</label><input id="symbol" value="台達電" placeholder="例：台達電、2308、台積電、2330"><label>買進價</label><input id="buyPrice" inputmode="decimal" placeholder="例：1714.4"><div class="row"><div><label>ATR 天數</label><select id="atrDays"><option value="10">10 日：短線</option><option value="14" selected>14 日：標準</option><option value="20">20 日：波段</option></select></div><div><label>市場</label><select id="market"><option value="tw" selected>上市 TWSE</option></select></div></div><button id="analyzeBtn">開始計算</button><div id="status" class="status"></div><div class="hint">這版先修上市股資料源。請測 2308、2330、2317。上櫃股下一版再補。</div></section><section class="card" id="result"><div class="empty">輸入股票後按「開始計算」。</div></section></main><div class="footer">風險警語：本工具只做技術分析與風控試算，不是投資建議，也不保證資料即時或正確。</div></div><script>const nameMap={'台積電':'2330','tsmc':'2330','鴻海':'2317','聯發科':'2454','台達電':'2308','廣達':'2382','緯創':'3231','技嘉':'2376','華碩':'2357','欣興':'3037','南電':'8046','國巨':'2327','華新科':'2492','長榮':'2603','陽明':'2609','中華電':'2412','富邦金':'2881','國泰金':'2882'};const fmt=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'--';const pct=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'--';function sym(x){x=x.trim();if(nameMap[x])return nameMap[x];let m=x.match(/\d{4}/);return m?m[0]:x}function num(v){return parseFloat(String(v||'').replace(/,/g,''))}function roc(s){let p=String(s).split('/');return p.length===3?`${+p[0]+1911}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`:s}function months(n=9){let a=[],d=new Date();for(let i=0;i<n;i++){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}01`)}return a}async function getJson(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}async function fetchTwse(code){let all=[];for(const date of months(9)){let url=`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${date}&stockNo=${code}`;try{let j=await getJson(url);if(Array.isArray(j.data)){j.data.forEach(row=>{let open=num(row[3]),high=num(row[4]),low=num(row[5]),close=num(row[6]),volume=num(row[1]);if([open,high,low,close].every(Number.isFinite))all.push({date:roc(row[0]),open,high,low,close,volume})})}}catch(e){}}let seen=new Set();let rows=all.filter(r=>!seen.has(r.date)&&seen.add(r.date)).sort((a,b)=>a.date.localeCompare(b.date));if(rows.length<30)throw Error('TWSE 日線不足，請確認是否為上市股票代碼');return{data:rows,source:'TWSE 官方資料 '+code}}function atr(rows,d){let trs=[];for(let i=1;i<rows.length;i++){let r=rows[i],p=rows[i-1];trs.push(Math.max(r.high-r.low,Math.abs(r.high-p.close),Math.abs(r.low-p.close)))}let x=trs.slice(-d);return x.reduce((a,b)=>a+b,0)/x.length}function sma(rows,d){let x=rows.slice(-d);return x.reduce((a,r)=>a+r.close,0)/x.length}function render({code,source,rows,days,buy}){let last=rows.at(-1),cur=last.close,a=atr(rows,days),hi20=Math.max(...rows.slice(-20).map(r=>r.high)),lo20=Math.min(...rows.slice(-20).map(r=>r.low)),ma20=sma(rows,20),ma60=sma(rows,60),gain=buy?(cur-buy)/buy*100:NaN,stop2=(buy||cur)-a*2,stop25=(buy||cur)-a*2.5,trail=hi20-a*3,atrp=a/cur*100;let adv=[];if(buy){if(cur<=stop2)adv.push(['danger',`目前價已跌破 ATR × 2 停損線 ${fmt(stop2)}，停損優先。`]);else if(gain>6)adv.push(['good',`已有獲利 ${pct(gain)}，改用移動停利 ${fmt(trail)} 保護利潤。`]);else adv.push(['watch',`目前損益 ${pct(gain)}，標準停損看 ${fmt(stop2)}，波動大看 ${fmt(stop25)}。`])}else adv.push(['watch',`沒有輸入買進價，用目前價反推新建倉停損：${fmt(stop2)}。`]);if(cur>ma20&&ma20>ma60&&cur<(buy||ma20)+a*3)adv.push(['good','趨勢偏強，可考慮小量加碼，但停損要跟著 ATR 線。']);else if(cur>(buy||ma20)+a*3)adv.push(['danger','目前離買進價或均線太遠，不建議追高加碼。']);else adv.push(['watch','加碼條件普通，等拉回不破 20 日線或放量突破再看。']);if(cur<ma20)adv.push(['danger','目前價低於 20 日均線，短線轉弱，先防守。']);let recent=rows.slice(-8).reverse();document.getElementById('result').innerHTML=`<div class="title">${code}｜${source}｜最新日線：${last.date}</div><div class="metrics"><div class="box"><div class="k">目前價</div><div class="v">${fmt(cur)}</div></div><div class="box"><div class="k">買進價</div><div class="v">${buy?fmt(buy):'未輸入'}</div><div class="k">${buy?'損益 '+pct(gain):''}</div></div><div class="box"><div class="k">${days} 日 ATR</div><div class="v">${fmt(a)}</div><div class="k">約股價 ${atrp.toFixed(2)}%</div></div></div><div class="title" style="margin-top:18px">關鍵價位</div><div class="levels"><div class="box"><div class="k">標準停損 ATR × 2</div><div class="v red">${fmt(stop2)}</div></div><div class="box"><div class="k">波動大停損 ATR × 2.5</div><div class="v red">${fmt(stop25)}</div></div><div class="box"><div class="k">移動停利 20 日高點 - ATR × 3</div><div class="v green">${fmt(trail)}</div></div><div class="box"><div class="k">20 日均線</div><div class="v blue">${fmt(ma20)}</div></div><div class="box"><div class="k">60 日均線</div><div class="v blue">${fmt(ma60)}</div></div><div class="box"><div class="k">20 日低點</div><div class="v">${fmt(lo20)}</div></div></div><div class="title" style="margin-top:18px">操作建議</div>${adv.map(x=>`<div class="advice ${x[0]}">${x[1]}</div>`).join('')}<div class="title" style="margin-top:18px">最近日線</div><table><thead><tr><th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>量</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.open)}</td><td>${fmt(r.high)}</td><td>${fmt(r.low)}</td><td>${fmt(r.close)}</td><td>${fmt(r.volume)}</td></tr>`).join('')}</tbody></table>`}async function analyze(){let btn=document.getElementById('analyzeBtn'),status=document.getElementById('status'),code=sym(document.getElementById('symbol').value),buy=parseFloat(document.getElementById('buyPrice').value),days=parseInt(document.getElementById('atrDays').value,10);btn.disabled=true;status.textContent='正在抓 TWSE 官方日線資料...';try{let r=await fetchTwse(code);status.textContent=`資料成功：${r.source}，共 ${r.data.length} 筆日線。`;render({code,source:r.source,rows:r.data,days,buy:Number.isFinite(buy)&&buy>0?buy:null})}catch(e){status.textContent='抓不到資料。請先用上市股票代碼測試，例如 2308、2330。';document.getElementById('result').innerHTML=`<div class="empty">資料抓取失敗。<br>這版先支援上市股 TWSE。<br>請測 2308、2330、2317。<br><br>錯誤：${e.message}</div>`}finally{btn.disabled=false}}document.getElementById('analyzeBtn').addEventListener('click',analyze);document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});document.getElementById('buyPrice').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});</script></body></html>
