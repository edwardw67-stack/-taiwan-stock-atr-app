<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>台股 ATR 停損停利計算器</title><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 14px}h1{font-size:32px;margin:0 0 8px}.sub,.hint,.footer{color:#9ca3af;line-height:1.7}.badge{display:inline-block;color:#d6b15f;border:1px solid rgba(214,177,95,.5);border-radius:999px;padding:8px 12px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 18px 70px rgba(0,0,0,.35)}label{display:block;color:#9ca3af;margin:14px 0 7px}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:#202633;color:#eef2ff;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#e3c16c,#9f792a);color:#090b10}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:#d6b15f;margin-top:12px;line-height:1.6}.metrics,.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:#172033;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px}.k{font-size:13px;color:#9ca3af}.v{font-size:24px;font-weight:900;margin-top:7px}.title{color:#d6b15f;font-weight:900;font-size:18px;margin:6px 0 12px}.red{color:#ef4444}.green{color:#22c55e}.blue{color:#60a5fa}.gold{color:#d6b15f}.advice{border-left:4px solid #d6b15f;background:rgba(255,255,255,.05);border-radius:14px;padding:13px 14px;margin:10px 0;line-height:1.6}.danger{border-left-color:#ef4444}.good{border-left-color:#22c55e}.watch{border-left-color:#60a5fa}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}td,th{border-bottom:1px solid rgba(255,255,255,.1);padding:9px;text-align:right}td:first-child,th:first-child{text-align:left}.empty{min-height:320px;display:grid;place-items:center;color:#9ca3af;text-align:center;line-height:1.8}.symwrap{position:relative}.suggest{display:none;position:absolute;z-index:9;top:86px;left:0;right:0;background:#111827;border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}.sug{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}.sug:hover{background:#263247}.sug b{color:#d6b15f}.sug span{color:#9ca3af;font-size:13px;margin-left:6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.metrics,.levels{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>台股 ATR 停損停利計算器</h1><div class="sub">支援上市、上櫃與興櫃實驗版。新版加入 5 日短線防守，避免波段 ATR 太鬆。</div><div class="badge">老韭投資筆記｜風控工具</div><main class="grid"><section class="card"><div class="title">輸入條件</div><div class="symwrap"><label>股票代碼或公司名稱</label><input id="symbol" value="欣興" placeholder="輸入代碼、股名或部分關鍵字"><div id="suggest" class="suggest"></div></div><label>買進價</label><input id="buyPrice" inputmode="decimal" placeholder="例：534.16"><div class="row"><div><label>ATR 天數</label><select id="atrDays"><option value="10">10 日：短線</option><option value="14" selected>14 日：標準</option><option value="20">20 日：波段</option></select></div><div><label>市場</label><select id="market"><option value="auto" selected>自動判斷</option><option value="tw">上市 TWSE</option><option value="otc">上櫃 TPEx</option><option value="emg">興櫃 ESB 實驗</option></select></div></div><button id="analyzeBtn">開始計算</button><div id="status" class="status"></div><div class="hint">新增：5 日 ATR、5 日高低、5 日短線保護價。大賺後不要只看 20 日 ATR，會太鬆。</div></section><section class="card" id="result"><div class="empty">輸入股票後按「開始計算」。</div></section></main><div class="footer">風險警語：本工具只做技術分析與風控試算，不是投資建議，也不保證資料即時或正確。</div></div><script>const stocks=[['2330','台積電','tw'],['2317','鴻海','tw'],['2454','聯發科','tw'],['2308','台達電','tw'],['2382','廣達','tw'],['3231','緯創','tw'],['6669','緯穎','tw'],['2376','技嘉','tw'],['2357','華碩','tw'],['3037','欣興','tw'],['8046','南電','tw'],['2327','國巨','tw'],['2492','華新科','tw'],['1582','信錦','tw'],['3017','奇鋐','tw'],['3324','雙鴻','otc'],['3653','健策','tw'],['3661','世芯-KY','tw'],['3443','創意','tw'],['2059','川湖','tw'],['2383','台光電','tw'],['2368','金像電','tw'],['6805','富世達','otc'],['6488','環球晶','otc'],['5274','信驊','otc'],['8299','群聯','otc'],['5347','世界','otc'],['8069','元太','otc'],['7584','樂意','emg'],['7722','LINEPAY','emg'],['7728','光焱科技','emg']];const fmt=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'--';const pct=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'--';function pick(x){x=x.trim();let m=x.match(/\d{4}/);if(m)return m[0];let hit=stocks.find(s=>s[1]===x)||stocks.find(s=>x&&s[1].includes(x));return hit?hit[0]:x}function marketOf(code,sel){if(sel!=='auto')return sel;let s=stocks.find(x=>x[0]===code);return s?s[2]:'tw'}function n(v){return parseFloat(String(v||'').replace(/,/g,'').replace(/--/g,'').replace(/X/g,''))}function roc(s){let p=String(s).split('/');return p.length===3?`${+p[0]+1911}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`:s}function ymdMonths(k=9){let a=[],d=new Date();for(let i=0;i<k;i++){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}01`)}return a}function rocMonths(k=9){let a=[],d=new Date();for(let i=0;i<k;i++){let x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()-1911}/${String(x.getMonth()+1).padStart(2,'0')}`)}return a}async function getJson(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}function uniqueSort(all){let seen=new Set();return all.filter(r=>!seen.has(r.date)&&seen.add(r.date)).sort((a,b)=>a.date.localeCompare(b.date))}function pushRow(all,r){let nums=r.map(x=>n(x));let date=r[0];let open=nums[3],high=nums[4],low=nums[5],close=nums[6],volume=nums[1];if(![open,high,low,close].every(Number.isFinite)){open=nums[4];high=nums[5];low=nums[6];close=nums[7];volume=nums[2]}if([open,high,low,close].every(Number.isFinite))all.push({date:roc(date),open,high,low,close,volume})}async function fetchTwse(code){let all=[];for(const date of ymdMonths()){let url=`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${date}&stockNo=${code}`;try{let j=await getJson(url);(j.data||[]).forEach(r=>pushRow(all,r))}catch(e){}}let rows=uniqueSort(all);if(rows.length<30)throw Error('TWSE 日線不足');return{data:rows,source:'TWSE 上市官方資料 '+code}}async function fetchOtc(code){let all=[];for(const m of rocMonths()){let url=`https://www.tpex.org.tw/web/stock/aftertrading/daily_trading_info/st43_result.php?l=zh-tw&d=${m}&stkno=${code}`;try{let j=await getJson(url);let arr=j.aaData||j.data||[];arr.forEach(r=>pushRow(all,r))}catch(e){}}let rows=uniqueSort(all);if(rows.length<30)throw Error('TPEx 日線不足或被瀏覽器擋資料');return{data:rows,source:'TPEx 上櫃官方資料 '+code}}async function fetchEmerging(code){throw Error('興櫃資料常被官方端擋住，這版保留選項但不保證可抓。')}async function fetchDaily(code,market){if(market==='emg')return await fetchEmerging(code);if(market==='otc')return await fetchOtc(code);if(market==='tw')return await fetchTwse(code);try{return await fetchTwse(code)}catch(e){return await fetchOtc(code)}}function atr(rows,d){let trs=[];for(let i=1;i<rows.length;i++){let r=rows[i],p=rows[i-1];trs.push(Math.max(r.high-r.low,Math.abs(r.high-p.close),Math.abs(r.low-p.close)))}let x=trs.slice(-Math.min(d,trs.length));return x.reduce((a,b)=>a+b,0)/x.length}function sma(rows,d){let x=rows.slice(-Math.min(d,rows.length));return x.reduce((a,r)=>a+r.close,0)/x.length}function render({code,source,rows,days,buy,market}){let last=rows.at(-1),cur=last.close,a=atr(rows,days),a5=atr(rows,5),r5=rows.slice(-5),hi5=Math.max(...r5.map(r=>r.high)),lo5=Math.min(...r5.map(r=>r.low)),hi20=Math.max(...rows.slice(-20).map(r=>r.high)),ma5=sma(rows,5),ma20=sma(rows,20),ma60=sma(rows,60),gain=buy?(cur-buy)/buy*100:NaN,stop2=(buy||cur)-a*2,rawTrail=hi20-a*3,feeFloor=buy?buy*1.006:NaN,profitLock30=buy?buy+(cur-buy)*0.3:NaN,profitLock50=buy?buy+(cur-buy)*0.5:NaN,shortA=cur-a5*.8,shortB=lo5,shortProtect=buy&&gain>0?Math.max(feeFloor,profitLock50,Math.min(cur*.985,Math.max(shortA,shortB))):Math.min(shortA,shortB),swingProtect=buy&&gain>0?Math.max(rawTrail,feeFloor,gain>6?profitLock30:feeFloor):rawTrail,finalProtect=buy&&gain>18?Math.max(shortProtect,swingProtect):swingProtect,atrp=a/cur*100,atr5p=a5/cur*100;let adv=[];if(buy&&gain>18)adv.push(['good',`大幅獲利 ${pct(gain)}，改看 5 日短線保護價 ${fmt(shortProtect)}，不要再用很鬆的 20 日波段線。`]);else if(buy&&gain>0)adv.push(['good',`已有獲利 ${pct(gain)}，建議保護價 ${fmt(finalProtect)}，至少不能低於保本線 ${fmt(feeFloor)}。`]);else if(buy)adv.push(['watch',`目前損益 ${pct(gain)}，標準停損看 ${fmt(stop2)}。`]);else adv.push(['watch',`沒有輸入買進價，用目前價反推新建倉停損：${fmt(stop2)}。`]);if(cur<ma5)adv.push(['danger','目前價跌破 5 日均線，短線已經轉弱，獲利部位要收緊。']);if(cur<ma20)adv.push(['danger','目前價低於 20 日均線，波段轉弱，先防守。']);if(cur>ma20&&ma20>ma60)adv.push(['good','中期趨勢仍偏強，但加碼只適合小量，別追太滿。']);let recent=rows.slice(-8).reverse();document.getElementById('result').innerHTML=`<div class="title">${code}｜${source}｜最新日線：${last.date}</div><div class="metrics"><div class="box"><div class="k">目前價</div><div class="v">${fmt(cur)}</div></div><div class="box"><div class="k">買進價</div><div class="v">${buy?fmt(buy):'未輸入'}</div><div class="k">${buy?'損益 '+pct(gain):''}</div></div><div class="box"><div class="k">5 日 ATR</div><div class="v">${fmt(a5)}</div><div class="k">約股價 ${atr5p.toFixed(2)}%</div></div></div><div class="title" style="margin-top:18px">5 日短線統計</div><div class="levels"><div class="box"><div class="k">5 日短線保護價</div><div class="v green">${fmt(shortProtect)}</div></div><div class="box"><div class="k">5 日高點</div><div class="v gold">${fmt(hi5)}</div></div><div class="box"><div class="k">5 日低點</div><div class="v red">${fmt(lo5)}</div></div><div class="box"><div class="k">5 日均線</div><div class="v blue">${fmt(ma5)}</div></div><div class="box"><div class="k">目前價 - 5ATR×0.8</div><div class="v green">${fmt(shortA)}</div></div><div class="box"><div class="k">鎖 50% 獲利</div><div class="v green">${buy?fmt(profitLock50):'--'}</div></div></div><div class="title" style="margin-top:18px">波段價位</div><div class="levels"><div class="box"><div class="k">最終建議保護價</div><div class="v green">${fmt(finalProtect)}</div></div><div class="box"><div class="k">20 日原始 ATR 移動停利</div><div class="v gold">${fmt(rawTrail)}</div></div><div class="box"><div class="k">保本線 含成本緩衝</div><div class="v blue">${buy?fmt(feeFloor):'--'}</div></div><div class="box"><div class="k">${days} 日 ATR</div><div class="v">${fmt(a)}</div><div class="k">約股價 ${atrp.toFixed(2)}%</div></div><div class="box"><div class="k">標準停損 ATR × 2</div><div class="v red">${fmt(stop2)}</div></div><div class="box"><div class="k">20 日均線</div><div class="v blue">${fmt(ma20)}</div></div></div><div class="title" style="margin-top:18px">操作建議</div>${adv.map(x=>`<div class="advice ${x[0]}">${x[1]}</div>`).join('')}<div class="title" style="margin-top:18px">最近日線</div><table><thead><tr><th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>量</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.open)}</td><td>${fmt(r.high)}</td><td>${fmt(r.low)}</td><td>${fmt(r.close)}</td><td>${fmt(r.volume)}</td></tr>`).join('')}</tbody></table>`}async function analyze(){let btn=document.getElementById('analyzeBtn'),status=document.getElementById('status'),code=pick(document.getElementById('symbol').value),buy=parseFloat(document.getElementById('buyPrice').value),days=parseInt(document.getElementById('atrDays').value,10),mk=marketOf(code,document.getElementById('market').value);btn.disabled=true;status.textContent=`正在抓 ${mk==='otc'?'TPEx 上櫃':mk==='emg'?'TPEx 興櫃':'TWSE 上市'} 日線資料...`;try{let r=await fetchDaily(code,mk);status.textContent=`資料成功：${r.source}，共 ${r.data.length} 筆資料。`;render({code,source:r.source,rows:r.data,days,buy:Number.isFinite(buy)&&buy>0?buy:null,market:mk})}catch(e){status.textContent='抓不到資料。請改用代碼，或手動切換上市／上櫃再試。';document.getElementById('result').innerHTML=`<div class="empty">資料抓取失敗。<br>請測上市 3037、2492，或上櫃 8069。<br><br>錯誤：${e.message}</div>`}finally{btn.disabled=false}}function showSug(){let q=document.getElementById('symbol').value.trim(),box=document.getElementById('suggest');if(!q){box.style.display='none';return}let m=stocks.filter(s=>s[0].includes(q)||s[1].includes(q)).slice(0,8);if(!m.length){box.style.display='none';return}box.innerHTML=m.map(s=>`<div class="sug" data-code="${s[0]}" data-name="${s[1]}" data-mk="${s[2]}"><b>${s[0]}</b> ${s[1]} <span>${s[2]==='emg'?'興櫃':s[2]==='otc'?'上櫃':'上市'}</span></div>`).join('');box.style.display='block'}document.getElementById('symbol').addEventListener('input',showSug);document.getElementById('suggest').addEventListener('click',e=>{let el=e.target.closest('.sug');if(!el)return;document.getElementById('symbol').value=`${el.dataset.code} ${el.dataset.name}`;document.getElementById('market').value=el.dataset.mk;document.getElementById('suggest').style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('.symwrap'))document.getElementById('suggest').style.display='none'});document.getElementById('analyzeBtn').addEventListener('click',analyze);document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});document.getElementById('buyPrice').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});</script></body></html>
