<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股 ATR 停損停利計算器</title>
  <meta name="description" content="輸入台股代碼或公司名稱，計算 ATR 停損、移動停利、加碼區間與交易建議。" />
  <style>
    :root {
      --bg: #080b12;
      --panel: #111827;
      --panel2: #172033;
      --text: #eef2ff;
      --muted: #9ca3af;
      --gold: #d6b15f;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #60a5fa;
      --border: rgba(255,255,255,.1);
      --shadow: 0 18px 70px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(214,177,95,.18), transparent 34%),
        radial-gradient(circle at top right, rgba(96,165,250,.16), transparent 32%),
        var(--bg);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 48px; }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 22px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #d6b15f, #755b1f);
      color: #07090f; font-weight: 900;
      box-shadow: var(--shadow);
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: .03em; }
    .sub { color: var(--muted); margin-top: 8px; line-height: 1.55; }
    .badge { color: var(--gold); border: 1px solid rgba(214,177,95,.45); padding: 8px 10px; border-radius: 999px; white-space: nowrap; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 390px 1fr; gap: 18px; align-items: start; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
      backdrop-filter: blur(14px);
    }
    label { display: block; color: var(--muted); font-size: 13px; margin: 14px 0 7px; }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input:focus, select:focus { border-color: rgba(214,177,95,.8); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #e3c16c, #9f792a);
      color: #090b10;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 12px; }
    .status { margin-top: 12px; color: var(--gold); font-size: 13px; line-height: 1.5; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    .metric { background: rgba(255,255,255,.045); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 24px; font-weight: 900; margin-top: 7px; }
    .metric .s { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .section-title { font-size: 18px; font-weight: 900; margin: 8px 0 12px; color: var(--gold); }
    .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .level { border-radius: 18px; padding: 14px; border: 1px solid var(--border); background: var(--panel2); }
    .level strong { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .level b { font-size: 22px; }
    .red { color: var(--red); } .green { color: var(--green); } .blue { color: var(--blue); } .gold { color: var(--gold); }
    .advice { display: grid; gap: 10px; }
    .advice-item { border-left: 4px solid var(--gold); background: rgba(255,255,255,.045); border-radius: 14px; padding: 13px 14px; line-height: 1.55; }
    .advice-item.danger { border-color: var(--red); }
    .advice-item.good { border-color: var(--green); }
    .advice-item.watch { border-color: var(--blue); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; overflow: hidden; border-radius: 14px; font-size: 13px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 700; }
    .empty { min-height: 390px; display: grid; place-items: center; color: var(--muted); text-align: center; line-height: 1.8; }
    .footer { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.7; }
    @media (max-width: 900px) {
      header { display: block; }
      .badge { display: inline-block; margin-top: 12px; }
      .grid { grid-template-columns: 1fr; }
      .cards, .levels { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .cards, .levels, .row { grid-template-columns: 1fr; }
      .wrap { padding: 20px 12px 36px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">ATR</div>
        <div>
          <h1>台股 ATR 停損停利計算器</h1>
          <div class="sub">輸入台股代碼或公司名稱，抓日線資料，計算停損、移動停利、加碼區與直接建議。</div>
        </div>
      </div>
      <div class="badge">老韭投資筆記｜風控工具</div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="section-title">輸入條件</div>
        <label for="symbol">股票代碼或公司名稱</label>
        <input id="symbol" placeholder="例：台積電、2330、台達電、2308" value="台積電" />

        <label for="buyPrice">買進價</label>
        <input id="buyPrice" inputmode="decimal" placeholder="例：950。沒有持股可留空" />

        <div class="row">
          <div>
            <label for="atrDays">ATR 天數</label>
            <select id="atrDays">
              <option value="10">10 日：短線</option>
              <option value="14" selected>14 日：標準</option>
              <option value="20">20 日：波段</option>
            </select>
          </div>
          <div>
            <label for="market">市場</label>
            <select id="market">
              <option value="auto" selected>自動判斷</option>
              <option value="tw">上市 .TW</option>
              <option value="two">上櫃 .TWO</option>
            </select>
          </div>
        </div>

        <button id="analyzeBtn">開始計算</button>
        <div id="status" class="status"></div>
        <div class="hint">
          資料來源預設抓 Stooq 日線 CSV。若瀏覽器或資料源擋住，請改用股票代碼再試。<br />
          ATR 不是神，它只是幫你把「正常震盪」和「該砍的破線」分開。
        </div>
      </section>

      <section class="card" id="result">
        <div class="empty">輸入股票後按「開始計算」。<br />會顯示 ATR、停損線、移動停利線、加碼建議。</div>
      </section>
    </main>

    <div class="footer">
      風險警語：本工具只做技術分析與風控試算，不是投資建議，也不保證資料即時或正確。下單前請自行確認券商報價、成交量、處置狀態與重大新聞。
    </div>
  </div>

  <script>
    const nameMap = {
      "台積電":"2330", "tsmc":"2330", "鴻海":"2317", "聯發科":"2454", "台達電":"2308", "廣達":"2382",
      "緯創":"3231", "緯穎":"6669", "技嘉":"2376", "華碩":"2357", "欣興":"3037", "南電":"8046",
      "國巨":"2327", "華新科":"2492", "信錦":"1582", "奇鋐":"3017", "雙鴻":"3324", "健策":"3653",
      "世芯":"3661", "創意":"3443", "川湖":"2059", "台光電":"2383", "金像電":"2368", "富世達":"6805",
      "長榮":"2603", "陽明":"2609", "萬海":"2615", "中華電":"2412", "富邦金":"2881", "國泰金":"2882"
    };

    const fmt = n => Number.isFinite(n) ? n.toLocaleString("zh-TW", { maximumFractionDigits: 2 }) : "--";
    const pct = n => Number.isFinite(n) ? `${n >= 0 ? "+" : ""}${n.toFixed(2)}%` : "--";

    function normalizeSymbol(input) {
      const raw = input.trim();
      const lower = raw.toLowerCase();
      if (nameMap[raw]) return nameMap[raw];
      if (nameMap[lower]) return nameMap[lower];
      const m = raw.match(/\d{4,6}/);
      return m ? m[0] : raw;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const data = [];
      for (let i = 1; i < lines.length; i++) {
        const [date, open, high, low, close, volume] = lines[i].split(',');
        const row = { date, open:+open, high:+high, low:+low, close:+close, volume:+volume };
        if ([row.open,row.high,row.low,row.close].every(Number.isFinite)) data.push(row);
      }
      return data;
    }

    async function fetchDaily(symbol, market) {
      const suffixes = market === "tw" ? ["tw"] : market === "two" ? ["two"] : ["tw", "two"];
      let lastErr = null;
      for (const suffix of suffixes) {
        const url = `https://stooq.com/q/d/l/?s=${symbol}.${suffix}&i=d`;
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const data = parseCSV(text);
          if (data.length > 30) return { data, source: `${symbol}.${suffix}`, url };
          lastErr = new Error("資料筆數不足");
        } catch (err) { lastErr = err; }
      }
      throw lastErr || new Error("抓不到資料");
    }

    function calcATR(rows, days) {
      const trs = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i], prev = rows[i-1];
        const tr = Math.max(r.high - r.low, Math.abs(r.high - prev.close), Math.abs(r.low - prev.close));
        trs.push(tr);
      }
      const recent = trs.slice(-days);
      return recent.reduce((a,b)=>a+b,0) / recent.length;
    }

    function sma(rows, days) {
      const recent = rows.slice(-days);
      return recent.reduce((a,r)=>a+r.close,0) / recent.length;
    }

    function buildAdvice({ current, buy, atr, high20, high60, low20, sma20, sma60, atrPct, gainPct }) {
      const stop2 = buy ? buy - atr * 2 : current - atr * 2;
      const stop25 = buy ? buy - atr * 2.5 : current - atr * 2.5;
      const trailing3 = high20 - atr * 3;
      const trendStrong = current > sma20 && sma20 > sma60;
      const nearStop = current <= stop2 + atr * 0.6;
      const tooExtended = buy ? current > buy + atr * 3 : current > sma20 + atr * 2.5;
      const breakoutLike = current > high20 - atr * 0.5 && trendStrong;
      const items = [];

      if (buy) {
        if (current <= stop2) {
          items.push(["danger", `停損優先：目前價已跌破 ATR × 2 停損線 ${fmt(stop2)}，這種不要凹，先砍再說。`]);
        } else if (gainPct > 6) {
          items.push(["good", `已有獲利：不要再用原始買進價思考，改用移動停利 ${fmt(trailing3)} 保護利潤。`]);
        } else if (gainPct < -3) {
          items.push(["danger", `目前浮虧 ${pct(gainPct)}，離停損線 ${fmt(stop2)} 不遠，先防守，不要亂加碼攤平。`]);
        } else {
          items.push(["watch", `目前損益 ${pct(gainPct)}，還在可控範圍。標準停損看 ${fmt(stop2)}，波動大就放到 ${fmt(stop25)}。`]);
        }
      } else {
        items.push(["watch", `沒有輸入買進價，所以用目前價反推風控。新建倉標準停損可先看 ${fmt(stop2)}。`]);
      }

      if (trendStrong && !tooExtended && !nearStop) {
        items.push(["good", `加碼建議：趨勢偏強，價格站上 20 日與 60 日均線。若要加碼，只適合小量，停損一樣要跟著 ATR 線。`]);
      } else if (tooExtended) {
        items.push(["danger", `加碼建議：不建議追高。現在離買進價或均線太遠，風報比不漂亮，硬追很容易被洗到靠北。`]);
      } else if (nearStop) {
        items.push(["danger", `加碼建議：不要加碼。價格太接近 ATR 停損線，這裡該想的是防守，不是攤平。`]);
      } else {
        items.push(["watch", `加碼建議：條件普通，等拉回不破 20 日線，或放量突破近期高點再考慮。`]);
      }

      if (atrPct > 5) items.push(["danger", `波動提醒：ATR 約股價 ${atrPct.toFixed(2)}%，波動偏大，停損不要設太緊，否則很容易被正常震盪掃掉。`]);
      if (breakoutLike) items.push(["good", `強勢訊號：價格接近 20 日高點且均線結構偏多，若量能配合，可以用 ATR × 3 當移動停利抱波段。`]);
      if (current < sma20) items.push(["danger", `趨勢警告：目前價低於 20 日均線，短線轉弱，先別急著加碼。`]);

      return { stop2, stop25, trailing3, items, trendStrong, low20, high60 };
    }

    function render(result) {
      const { symbol, source, rows, atrDays, buy } = result;
      const last = rows[rows.length - 1];
      const current = last.close;
      const atr = calcATR(rows, atrDays);
      const high20 = Math.max(...rows.slice(-20).map(r=>r.high));
      const high60 = Math.max(...rows.slice(-60).map(r=>r.high));
      const low20 = Math.min(...rows.slice(-20).map(r=>r.low));
      const ma20 = sma(rows, 20);
      const ma60 = sma(rows, 60);
      const atrPct = atr / current * 100;
      const gainPct = buy ? (current - buy) / buy * 100 : NaN;
      const advice = buildAdvice({ current, buy, atr, high20, high60, low20, sma20: ma20, sma60: ma60, atrPct, gainPct });
      const recent = rows.slice(-8).reverse();

      document.getElementById("result").innerHTML = `
        <div class="section-title">${symbol}｜${source}｜最新日線：${last.date}</div>
        <div class="cards">
          <div class="metric"><div class="k">目前價</div><div class="v">${fmt(current)}</div><div class="s">收盤資料</div></div>
          <div class="metric"><div class="k">買進價</div><div class="v">${buy ? fmt(buy) : "未輸入"}</div><div class="s">${buy ? "損益 " + pct(gainPct) : "可留空"}</div></div>
          <div class="metric"><div class="k">${atrDays} 日 ATR</div><div class="v">${fmt(atr)}</div><div class="s">約股價 ${atrPct.toFixed(2)}%</div></div>
          <div class="metric"><div class="k">20 日高點</div><div class="v">${fmt(high20)}</div><div class="s">移動停利用</div></div>
        </div>

        <div class="section-title">關鍵價位</div>
        <div class="levels">
          <div class="level"><strong>標準停損｜ATR × 2</strong><b class="red">${fmt(advice.stop2)}</b></div>
          <div class="level"><strong>波動大停損｜ATR × 2.5</strong><b class="red">${fmt(advice.stop25)}</b></div>
          <div class="level"><strong>移動停利｜20 日高點 - ATR × 3</strong><b class="green">${fmt(advice.trailing3)}</b></div>
          <div class="level"><strong>20 日均線</strong><b class="blue">${fmt(ma20)}</b></div>
          <div class="level"><strong>60 日均線</strong><b class="blue">${fmt(ma60)}</b></div>
          <div class="level"><strong>20 日低點</strong><b class="gold">${fmt(low20)}</b></div>
        </div>

        <div class="section-title">操作建議</div>
        <div class="advice">
          ${advice.items.map(([type, text]) => `<div class="advice-item ${type}">${text}</div>`).join("")}
        </div>

        <div class="section-title" style="margin-top:18px;">最近日線</div>
        <table>
          <thead><tr><th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>量</th></tr></thead>
          <tbody>${recent.map(r => `<tr><td>${r.date}</td><td>${fmt(r.open)}</td><td>${fmt(r.high)}</td><td>${fmt(r.low)}</td><td>${fmt(r.close)}</td><td>${fmt(r.volume)}</td></tr>`).join("")}</tbody>
        </table>
      `;
    }

    async function analyze() {
      const btn = document.getElementById("analyzeBtn");
      const status = document.getElementById("status");
      const input = document.getElementById("symbol").value;
      const symbol = normalizeSymbol(input);
      const buy = parseFloat(document.getElementById("buyPrice").value);
      const atrDays = parseInt(document.getElementById("atrDays").value, 10);
      const market = document.getElementById("market").value;
      if (!symbol) return;
      btn.disabled = true;
      status.textContent = "正在抓最新日線資料...";
      try {
        const { data, source } = await fetchDaily(symbol, market);
        status.textContent = `資料抓取成功：${source}，共 ${data.length} 筆日線。`;
        render({ symbol, source, rows: data, atrDays, buy: Number.isFinite(buy) && buy > 0 ? buy : null });
      } catch (err) {
        status.textContent = "抓不到資料。請用 4 位數股票代碼試試，或稍後再試。";
        document.getElementById("result").innerHTML = `<div class="empty">資料抓取失敗。<br />可能是代碼錯誤、資料源暫時擋住，或這檔股票不支援。<br /><br />錯誤：${err.message}</div>`;
      } finally { btn.disabled = false; }
    }

    document.getElementById("analyzeBtn").addEventListener("click", analyze);
    document.getElementById("symbol").addEventListener("keydown", e => { if (e.key === "Enter") analyze(); });
    document.getElementById("buyPrice").addEventListener("keydown", e => { if (e.key === "Enter") analyze(); });
  </script>
</body>
</html>
